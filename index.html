<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pay with M-PESA | Air's Simple Payment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      color: #006600; /* M-PESA green */
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #006600;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #004d00;
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }
    .success { color: #006600; }
    .error   { color: #cc0000; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Pay with M-PESA</h2>
    
    <form id="paymentForm">
      <label for="phone">Phone Number (format: 2547XXXXXXXX)</label>
      <input type="tel" id="phone" placeholder="254712345678" required pattern="254[17]\d{8}" title="Enter a valid Kenyan number starting with 2547 or 2541"/>

      <label for="amount">Amount (KES)</label>
      <input type="number" id="amount" placeholder="e.g. 100" min="1" required/>

      <button type="submit" id="payBtn">Pay Now</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById('paymentForm');
    const statusDiv = document.getElementById('status');
    const payBtn = document.getElementById('payBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const phone = document.getElementById('phone').value.trim();
      const amount = document.getElementById('amount').value.trim();

      if (!phone || !amount) {
        showStatus('Please fill in both fields', 'error');
        return;
      }

      payBtn.disabled = true;
      showStatus('Initiating payment... Please wait.', '');

      try {
        const response = await fetch('https://mpesa-stk-backend-ccgg.onrender.com/api/stk-push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, amount })
        });

        const data = await response.json();

        if (data.success) {
          showStatus('STK Push sent! Check your phone for M-PESA prompt.', 'success');
        } else {
          showStatus('Payment failed: ' + (data.error || 'Unknown error'), 'error');
        }
      } catch (err) {
        showStatus('Network error: ' + err.message, 'error');
      } finally {
        payBtn.disabled = false;
      }
    });

    function showStatus(message, type = '') {
      statusDiv.textContent = message;
      statusDiv.className = type;  // success or error
    }
  </script>

</body>
</html>
